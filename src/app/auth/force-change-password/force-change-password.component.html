<div class="auth-main">
  <div class="auth-wrapper v3">
    <div class="auth-form">
      <div class="auth-header">
        <img src="assets/images/omarise-logo-full.png" alt="Omarise" />
      </div>

      <div class="card my-5">
        <div class="card-body">
          <div class="text-center mb-4">
            <h3 class="mb-2"><b>{{ 'auth.forceChangePassword.title' | translate }}</b></h3>
            <p class="text-muted mb-0">{{ 'auth.forceChangePassword.subtitle' | translate }}</p>
          </div>

          <div class="alert alert-danger mb-3" *ngIf="serverMessage" role="alert">{{ serverMessage }}</div>

          <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
            <div class="form-group mb-3">
              <label class="form-label" for="newPassword">{{ 'auth.forceChangePassword.newPasswordLabel' | translate }}</label>
              <div class="input-group">
                <input
                  [type]="showNewPassword ? 'text' : 'password'"
                  class="form-control"
                  id="newPassword"
                  [placeholder]="'auth.forceChangePassword.newPasswordLabel' | translate"
                  formControlName="newPassword"
                  [class.is-invalid]="controlInvalid('newPassword')"
                />
                <button type="button" class="btn btn-outline-secondary" (click)="toggleShow('new')">
                  {{ (showNewPassword ? 'auth.resetPassword.hide' : 'auth.resetPassword.show') | translate }}
                </button>
                <div class="invalid-feedback d-block" *ngIf="controlInvalid('newPassword')">{{ messageFor('newPassword') }}</div>
              </div>
            </div>

            <div class="form-group mb-3">
              <label class="form-label" for="confirmNewPassword">{{ 'auth.forceChangePassword.confirmPasswordLabel' | translate }}</label>
              <div class="input-group">
                <input
                  [type]="showConfirmPassword ? 'text' : 'password'"
                  class="form-control"
                  id="confirmNewPassword"
                  [placeholder]="'auth.forceChangePassword.confirmPasswordLabel' | translate"
                  formControlName="confirmNewPassword"
                  [class.is-invalid]="controlInvalid('confirmNewPassword')"
                />
                <button type="button" class="btn btn-outline-secondary" (click)="toggleShow('confirm')">
                  {{ (showConfirmPassword ? 'auth.resetPassword.hide' : 'auth.resetPassword.show') | translate }}
                </button>
                <div class="invalid-feedback d-block" *ngIf="controlInvalid('confirmNewPassword')">{{ messageFor('confirmNewPassword') }}</div>
              </div>
            </div>

            <div class="d-grid mt-4">
              <button type="submit" class="btn btn-primary" [disabled]="loading || form.invalid">
                {{ (loading ? 'auth.forceChangePassword.saving' : 'auth.forceChangePassword.submit') | translate }}
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
