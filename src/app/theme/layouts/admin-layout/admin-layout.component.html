<app-navigation class="pc-sidebar" [ngClass]="{
    'navbar-collapsed': navCollapsed,
    'mob-open': navCollapsedMob
  }" (NavCollapse)="closeMenu()" />
<app-nav-bar (NavCollapsedMob)="navMobClick()" (NavCollapse)="handleNavCollapse()" />
<div class="pc-container">
  <div class="coded-wrapper">
    <div class="coded-content">
      <div class="coded-inner-content">
        <app-breadcrumb />
        <div class="main-body">
          <div class="page-wrapper">
            <router-outlet />
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="pc-menu-overlay" (click)="closeMenu()" (keydown)="handleKeyDown($event)" tabindex="0"></div>
</div>
<footer class="pc-footer">
  <div class="footer-wrapper container-fluid">
    <div class="row">
      <div class="col my-1">
        <p class="m-0">{{ 'footer.copyright' | translate }}</p>
      </div>
      <div class="col-auto my-1">
        <ul class="list-inline footer-link mb-0">
          <li class="list-inline-item"><a [routerLink]="['/dashboard/default']">{{ 'footer.home' | translate }}</a></li>
          <li class="list-inline-item">
            <a href="javascript:void(0)" (click)="openSupportModal()">{{ 'footer.contactUs' | translate }}</a>
          </li>
        </ul>
      </div>
    </div>
  </div>
</footer>

<app-support-contact-modal [open]="supportModalOpen" (closed)="onSupportModalClosed()" />
