<div class="not-found-page">
  <div class="not-found-card">
    <img src="assets/images/omarise-logo-full.png" alt="Omarise" class="not-found-logo" />

    <div class="not-found-icon">
      <i antIcon type="compass" theme="outline"></i>
    </div>

    <h1 class="not-found-code">404</h1>
    <h4 class="mb-2">{{ 'notFound.title' | translate }}</h4>
    <p class="text-muted mb-4">{{ 'notFound.body' | translate }}</p>

    <div class="d-flex gap-2 justify-content-center flex-wrap">
      <button type="button" class="btn btn-outline-secondary" (click)="goBack()">{{ 'notFound.goBack' | translate }}</button>
      <a routerLink="/dashboard/default" class="btn btn-primary">{{ 'notFound.backToHome' | translate }}</a>
    </div>
  </div>
</div>
