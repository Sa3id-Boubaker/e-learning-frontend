<div class="row">
  <div class="col-sm-12">
    <app-card [cardTitle]="'profile.changePassword.pageTitle' | translate">
      <ng-template #headerOptionsTemplate>
        <a [routerLink]="['/profile']" class="btn btn-outline-secondary btn-sm">{{ 'profile.changePassword.backToProfile' | translate }}</a>
      </ng-template>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="form-group mb-3">
          <label class="form-label" for="currentPassword">{{ 'profile.changePassword.currentPasswordLabel' | translate }}</label>
          <div class="input-group">
            <input
              [type]="showCurrentPassword ? 'text' : 'password'"
              class="form-control"
              id="currentPassword"
              [placeholder]="'profile.changePassword.currentPasswordLabel' | translate"
              formControlName="currentPassword"
              [class.is-invalid]="controlInvalid('currentPassword')"
            />
            <button type="button" class="btn btn-outline-secondary" (click)="toggleShow('current')">
              {{ (showCurrentPassword ? 'auth.resetPassword.hide' : 'auth.resetPassword.show') | translate }}
            </button>
            <div class="invalid-feedback d-block" *ngIf="controlInvalid('currentPassword')">{{ messageFor('currentPassword') }}</div>
          </div>
        </div>

        <div class="form-group mb-3">
          <label class="form-label" for="newPassword">{{ 'auth.resetPassword.newPasswordLabel' | translate }}</label>
          <div class="input-group">
            <input
              [type]="showNewPassword ? 'text' : 'password'"
              class="form-control"
              id="newPassword"
              [placeholder]="'auth.resetPassword.newPasswordLabel' | translate"
              formControlName="newPassword"
              [class.is-invalid]="controlInvalid('newPassword')"
            />
            <button type="button" class="btn btn-outline-secondary" (click)="toggleShow('new')">
              {{ (showNewPassword ? 'auth.resetPassword.hide' : 'auth.resetPassword.show') | translate }}
            </button>
            <div class="invalid-feedback d-block" *ngIf="controlInvalid('newPassword')">{{ messageFor('newPassword') }}</div>
          </div>
        </div>

        <div class="form-group mb-3">
          <label class="form-label" for="confirmNewPassword">{{ 'auth.forceChangePassword.confirmPasswordLabel' | translate }}</label>
          <div class="input-group">
            <input
              [type]="showConfirmPassword ? 'text' : 'password'"
              class="form-control"
              id="confirmNewPassword"
              [placeholder]="'auth.forceChangePassword.confirmPasswordLabel' | translate"
              formControlName="confirmNewPassword"
              [class.is-invalid]="controlInvalid('confirmNewPassword')"
            />
            <button type="button" class="btn btn-outline-secondary" (click)="toggleShow('confirm')">
              {{ (showConfirmPassword ? 'auth.resetPassword.hide' : 'auth.resetPassword.show') | translate }}
            </button>
            <div class="invalid-feedback d-block" *ngIf="controlInvalid('confirmNewPassword')">{{ messageFor('confirmNewPassword') }}</div>
          </div>
        </div>

        <div class="d-flex justify-content-end mt-4">
          <button type="submit" class="btn btn-primary" [disabled]="loading">
            {{ (loading ? 'profile.changePassword.changing' : 'profile.changePassword.submit') | translate }}
          </button>
        </div>
      </form>
    </app-card>
  </div>
</div>
