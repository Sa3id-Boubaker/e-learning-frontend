@if (open) {
  <div class="recording-metadata-modal-backdrop" (click)="onCancel()">
    <div
      #panel
      class="recording-metadata-modal-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="recordingMetadataModalTitle"
      tabindex="-1"
      (click)="$event.stopPropagation()"
      (keydown.escape)="onCancel()"
      (keydown.tab)="onKeydownTab($event)"
    >
      <div class="recording-metadata-modal-header">
        <h5 id="recordingMetadataModalTitle" class="mb-0">{{ 'trainings.recordingMetadataForm.editTitle' | translate }}</h5>
        <button type="button" class="btn-close" [attr.aria-label]="'common.close' | translate" [disabled]="saving" (click)="onCancel()"></button>
      </div>

      <div class="recording-metadata-modal-body">
        @if (serverMessage) {
          <div class="alert alert-danger mb-3" role="alert">{{ serverMessage }}</div>
        }

        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
          <div class="form-group mb-3">
            <label class="form-label" for="recordingTitle">{{ 'courses.formModal.titleLabel' | translate }}</label>
            <input type="text" class="form-control" id="recordingTitle" formControlName="title" [class.is-invalid]="controlInvalid('title')" />
            <div class="invalid-feedback d-block" *ngIf="controlInvalid('title')">{{ messageFor('title') }}</div>
          </div>

          <div class="form-group mb-3">
            <label class="form-label" for="recordingDescription">{{ 'courses.chapterFormModal.descriptionLabel' | translate }}</label>
            <textarea
              class="form-control"
              id="recordingDescription"
              rows="3"
              formControlName="description"
              [class.is-invalid]="controlInvalid('description')"
            ></textarea>
            <div class="invalid-feedback d-block" *ngIf="controlInvalid('description')">{{ messageFor('description') }}</div>
          </div>
        </form>
      </div>

      <div class="recording-metadata-modal-footer">
        <button type="button" class="btn btn-outline-secondary" [disabled]="saving" (click)="onCancel()">
          {{ 'common.cancel' | translate }}
        </button>
        <button type="button" class="btn btn-primary" [disabled]="saving || form.invalid || !hasChanges" (click)="submit()">
          {{ (saving ? 'common.saving' : 'common.saveChanges') | translate }}
        </button>
      </div>
    </div>
  </div>
}
