server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS server. Resolving api-gateway through a variable (rather than a
    # literal proxy_pass target) defers DNS lookup to request time instead of nginx startup, so
    # this container still starts and serves static files even if api-gateway isn't up yet.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $api_upstream http://api-gateway:8080;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Notifications are streamed over Server-Sent Events (text/event-stream) through this
        # same /api prefix — buffering/caching would delay or break delivery of live events.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
